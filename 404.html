<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polaris</title>
<meta name="robots" content="noindex">
<script>
// Share links (growth loop 1, docs/increments/share-links.md). GitHub Pages serves this page for any path it doesn't
// have, so short links live here: polarisbody.com/s/<code> (one shared card) and polarisbody.com/@handle (the line
// printed on cards) open the app's card page. ref= tells first-touch attribution where the person came from.
(function () {
  var p = location.pathname, m;
  if ((m = p.match(/^\/s\/([A-Za-z0-9]{8})\/?$/))) location.replace("/app/?share=" + m[1].toUpperCase() + "&ref=share");
  else if ((m = p.match(/^\/@([A-Za-z0-9_]{3,20})\/?$/))) location.replace("/app/?u=" + m[1].toLowerCase() + "&ref=handle");
})();
</script>
<style>
:root { color-scheme: light dark; --bg: #F3EFE8; --text: #1b1b1b; --muted: #5c5c5c }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0f0d; --text: #F3EFE8; --muted: #a1a1aa } }
body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, sans-serif }
h1 { margin: 0; font-size: 26px } p { margin: 0; color: var(--muted) } a { color: inherit; font-weight: 600 }
</style>
</head>
<body>
<h1>This page isn't here</h1>
<p>Head to the <a href="/">Polaris home page</a> or <a href="/app/">open the app</a>.</p>
</body>
</html>
